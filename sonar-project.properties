# SonarQube Project Configuration
sonar.projectKey=chicking
sonar.projectName=Chicking Web Application
sonar.projectVersion=0.1.0
sonar.host.url=http://localhost:9000

# Path to source and test directories
sonar.sources=src
sonar.tests=src

# Test inclusions and exclusions
sonar.test.inclusions=src/**/*.test.jsx,src/**/*.test.js,src/**/*.spec.jsx,src/**/*.spec.js
sonar.coverage.exclusions=src/main.jsx,src/**/*.test.jsx,src/**/*.spec.jsx,src/__mocks__/**

# Path to coverage reports generated by Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8
